<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="/" />
  <title>Portfolio</title>
  <link rel="stylesheet" href="css/shared.css" />
</head>
<body>
  <div id="app">Loading...</div>

  <!-- Required script for Blazor Hybrid (WebView) -->
  <script src="_framework/blazor.webview.js"></script>
  <!-- Theme management: set initial theme and provide toggle/set functions -->
  <script>
    (function(){
      var root = document.documentElement;
      var stored = null;
      try{ stored = localStorage.getItem('theme'); }catch(e){}
      // Default to dark theme if nothing stored
      if(stored === 'theme-dark' || stored === 'theme-light'){
        root.classList.add(stored);
      } else {
        root.classList.add('theme-dark');
      }

      // SVG icons
      var ICONS = {
        sun: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 4V2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 22v-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 12H2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 12h-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 5L3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 19l1.5 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 5l1.5-1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 19L3.5 20.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
        moon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      };

      function updateToggleButton(theme){
        var btn = document.getElementById('themeToggleBtn');
        if(!btn) return;
        if(theme === 'theme-dark'){
          btn.innerHTML = ICONS.moon;
          btn.setAttribute('aria-label','Switch to light theme');
          btn.title = 'Switch to light theme';
        } else {
          btn.innerHTML = ICONS.sun;
          btn.setAttribute('aria-label','Switch to dark theme');
          btn.title = 'Switch to dark theme';
        }
      }

      // expose functions to toggle or set theme
      window.setTheme = function(theme){
        if(theme !== 'theme-light' && theme !== 'theme-dark') return;
        root.classList.remove('theme-light','theme-dark');
        root.classList.add(theme);
        try{ localStorage.setItem('theme', theme); }catch(e){}
        updateToggleButton(theme);
      };
      window.toggleTheme = function(){
        var cur = root.classList.contains('theme-dark') ? 'theme-dark' : 'theme-light';
        var next = cur === 'theme-dark' ? 'theme-light' : 'theme-dark';
        window.setTheme(next);
      };

      // Try to update the button once it appears in the DOM
      var tries = 0;
      var trySetup = setInterval(function(){
        tries++;
        var cur = root.classList.contains('theme-dark') ? 'theme-dark' : 'theme-light';
        updateToggleButton(cur);
        if(document.getElementById('themeToggleBtn') || tries > 40){
          clearInterval(trySetup);
        }
      }, 200);

      // add transition helper after initial paint
      requestAnimationFrame(function(){ root.classList.add('theme-transition'); });
    })();
  </script>
</body>
</html>
